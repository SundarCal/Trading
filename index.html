<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Dashboard</title>
<style>
  :root {
    --bg: #0d1117; --bg2: #161b22; --bg3: #21262d; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e;
    --green: #3fb950; --red: #f85149; --blue: #58a6ff; --orange: #d29922; --purple: #a371f7;
    --ibkr: #f97316; --fidelity: #22c55e; --rh: #ef4444; --schwab: #3b82f6;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'SF Mono','Cascadia Code','Fira Code',monospace; font-size: 13px; min-height: 100vh; }
  .shell { display: flex; flex-direction: column; min-height: 100vh; }
  .topbar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: var(--bg2); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; flex-wrap: wrap; }
  .logo { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; letter-spacing: -0.5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
  .dot.red { background: var(--red); box-shadow: 0 0 8px var(--red); }
  .dot.orange { background: var(--orange); box-shadow: 0 0 8px var(--orange); }
  .spacer { flex: 1; }
  .sync-status { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .sync-status.ok { color: var(--green); }
  .sync-status.err { color: var(--red); }
  .sync-status.loading { color: var(--orange); }
  .nav { display: flex; gap: 2px; }
  .nav-btn { background: transparent; border: 1px solid transparent; color: var(--muted); padding: 6px 14px; border-radius: var(--radius); cursor: pointer; font-family: inherit; font-size: 12px; transition: all 0.15s; }
  .nav-btn:hover { color: var(--text); background: var(--bg3); }
  .nav-btn.active { color: var(--text); background: var(--bg3); border-color: var(--border); }
  .content { padding: 20px; flex: 1; max-width: 1400px; margin: 0 auto; width: 100%; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .metric { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
  .metric-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 6px; }
  .metric-val { font-size: 22px; font-weight: 700; letter-spacing: -1px; }
  .metric-val.green { color: var(--green); } .metric-val.red { color: var(--red); } .metric-val.blue { color: var(--blue); }
  .acct-tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .acct-tab { font-family: inherit; font-size: 11px; padding: 5px 12px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s; }
  .acct-tab:hover { border-color: var(--text); color: var(--text); }
  .acct-tab.active { color: #000; font-weight: 700; border-color: transparent; }
  .acct-tab.all.active { background: var(--text); }
  .acct-tab.ibkr.active { background: var(--ibkr); } .acct-tab.fidelity.active { background: var(--fidelity); }
  .acct-tab.rh.active { background: var(--rh); } .acct-tab.schwab.active { background: var(--schwab); }
  .tbl-wrap { border: 1px solid var(--border); border-radius: var(--radius); overflow-x: auto; margin-bottom: 20px; }
  table { width: 100%; border-collapse: collapse; }
  thead th { background: var(--bg2); color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  tbody td { padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; font-size: 12px; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--bg2); }
  .day-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; margin-bottom: 6px; border-bottom: 1px solid var(--border); }
  .day-label { font-size: 12px; color: var(--muted); }
  .chip { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; display: inline-block; }
  .chip-ibkr { background: #7c2d12; color: var(--ibkr); } .chip-fidelity { background: #14532d; color: var(--fidelity); }
  .chip-rh { background: #7f1d1d; color: var(--rh); } .chip-schwab { background: #1e3a5f; color: var(--schwab); }
  .badge { font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; display: inline-block; }
  .badge-buy { background: #0c2d48; color: var(--blue); } .badge-sell { background: #2d1b00; color: var(--orange); } .badge-spread { background: #1e1b4b; color: var(--purple); }
  .pos { color: var(--green); } .neg { color: var(--red); } .muted { color: var(--muted); }
  .filter-bar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .filter-bar input, .filter-bar select { background: var(--bg2); border: 1px solid var(--border); color: var(--text); font-family: inherit; font-size: 12px; padding: 6px 10px; border-radius: var(--radius); height: 32px; outline: none; }
  .filter-bar input:focus, .filter-bar select:focus { border-color: var(--blue); }
  .filter-bar input { min-width: 120px; }
  .filter-bar select option { background: var(--bg2); }
  .btn { background: var(--bg3); border: 1px solid var(--border); color: var(--text); font-family: inherit; font-size: 12px; padding: 6px 12px; border-radius: var(--radius); cursor: pointer; transition: all 0.15s; height: 32px; display: inline-flex; align-items: center; gap: 5px; }
  .btn:hover { border-color: var(--text); } .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-green { border-color: var(--green); color: var(--green); } .btn-green:hover { background: #0d2a0d; }
  .btn-blue { border-color: var(--blue); color: var(--blue); } .btn-blue:hover { background: #0d1a2a; }
  .btn-red { border-color: var(--red); color: var(--red); } .btn-red:hover { background: #2a0d0d; }
  .import-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
  .upload-card { background: var(--bg2); border: 2px dashed var(--border); border-radius: var(--radius); padding: 24px; text-align: center; cursor: pointer; transition: all 0.2s; }
  .upload-card:hover { border-style: solid; }
  .upload-card.ibkr:hover { border-color: var(--ibkr); } .upload-card.fidelity:hover { border-color: var(--fidelity); }
  .upload-card.rh:hover { border-color: var(--rh); } .upload-card.schwab:hover { border-color: var(--schwab); }
  .upload-card input[type=file] { display: none; }
  .upload-icon { font-size: 28px; margin-bottom: 8px; }
  .upload-broker { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
  .upload-hint { font-size: 11px; color: var(--muted); }
  .upload-count { font-size: 11px; margin-top: 8px; color: var(--green); }
  .info-box { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
  .info-box h3 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 12px; }
  .info-row { display: flex; gap: 8px; margin-bottom: 8px; font-size: 12px; align-items: baseline; }
  .info-row .bname { font-weight: 700; min-width: 80px; }
  .info-row.ibkr .bname { color: var(--ibkr); } .info-row.fidelity .bname { color: var(--fidelity); }
  .info-row.rh .bname { color: var(--rh); } .info-row.schwab .bname { color: var(--schwab); }
  .broker-summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .bcard { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
  .bcard-header { display: flex; align-items: center; gap: 6px; margin-bottom: 10px; }
  .bcard-dot { width: 8px; height: 8px; border-radius: 50%; }
  .bcard-name { font-size: 12px; font-weight: 700; }
  .bcard-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .bcard-row span:last-child { color: var(--text); font-weight: 600; }
  .empty { text-align: center; padding: 50px; color: var(--muted); }
  .empty-icon { font-size: 36px; margin-bottom: 10px; }
  .spread-pill { font-size: 9px; background: #1e1b4b; color: var(--purple); border-radius: 3px; padding: 1px 4px; margin-left: 4px; vertical-align: middle; }
  /* Setup wizard */
  .setup-wizard { max-width: 700px; }
  .step { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; }
  .step-num { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: var(--blue); color: #000; font-size: 11px; font-weight: 700; margin-right: 8px; }
  .step h3 { display: inline; font-size: 13px; font-weight: 700; }
  .step p { color: var(--muted); font-size: 12px; margin-top: 10px; line-height: 1.8; }
  .step code { background: var(--bg3); color: var(--green); padding: 2px 6px; border-radius: 4px; font-family: inherit; font-size: 12px; }
  .step .url-box { background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin-top: 10px; display: flex; align-items: center; gap: 8px; }
  .step .url-box input { background: transparent; border: none; color: var(--blue); font-family: inherit; font-size: 12px; flex: 1; outline: none; }
  .step .url-box button { font-size: 11px; }
  .step .img-hint { font-size: 11px; color: var(--muted); margin-top: 6px; font-style: italic; }
  .connected-banner { background: #0d2a0d; border: 1px solid var(--green); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--green); }
  .cash-editor { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .cash-row { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
  .cash-row label { font-size: 12px; font-weight: 700; min-width: 70px; }
  .cash-row input { background: var(--bg3); border: 1px solid var(--border); color: var(--text); font-family: inherit; font-size: 13px; padding: 5px 8px; border-radius: var(--radius); flex: 1; outline: none; }
  .cash-row input:focus { border-color: var(--blue); }
  @media (max-width: 600px) { .import-grid { grid-template-columns: 1fr; } .topbar { flex-wrap: wrap; } }

  /* Spreads page */
  .spread-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 12px; overflow: hidden; }
  .spread-header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .spread-symbol { font-size: 14px; font-weight: 700; letter-spacing: -0.3px; }
  .spread-expiry { font-size: 11px; color: var(--muted); background: var(--bg3); border-radius: 4px; padding: 2px 7px; }
  .spread-type-pill { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; }
  .spread-put  { background: #2d1b4e; color: #c084fc; }
  .spread-call { background: #1b2d4e; color: #60a5fa; }
  .spread-meta { display: flex; gap: 20px; padding: 12px 16px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
  .spread-meta-item { display: flex; flex-direction: column; gap: 3px; }
  .spread-meta-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; }
  .spread-meta-val { font-size: 13px; font-weight: 600; }
  .spread-legs { padding: 0; }
  .spread-leg { display: grid; grid-template-columns: 80px 90px 1fr 60px 45px 70px 75px 90px 80px; gap: 6px; align-items: center; padding: 9px 16px; border-bottom: 1px solid var(--border); font-size: 12px; }
  .spread-leg:last-child { border-bottom: none; }
  .spread-leg-header { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; background: var(--bg3); }
  .spread-pnl-banner { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: var(--bg3); font-size: 13px; }
  .spread-filters { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .status-open   { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; background: #0d2a0d; color: var(--green); }
  .status-closed { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; background: var(--bg3); color: var(--muted); }
  .status-expired{ font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 4px; background: #2d1b00; color: var(--orange); }
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="logo"><span class="dot" id="conn-dot"></span> TRADE//LOG</div>
    <div class="sync-status" id="sync-status">not connected</div>
    <div class="spacer"></div>
    <button class="btn btn-blue" onclick="syncNow()" id="sync-btn" style="font-size:11px">↺ Sync</button>
    <div class="nav">
      <button class="nav-btn active" onclick="showPage('activity')">Activity</button>
      <button class="nav-btn" onclick="showPage('spreads')">Spreads</button>
      <button class="nav-btn" onclick="showPage('positions')">Positions</button>
      <button class="nav-btn" onclick="showPage('import')">Import CSV</button>
      <button class="nav-btn" onclick="showPage('setup')">⚙ Setup</button>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<script>
const BROKERS = { ibkr:'IBKR', fidelity:'Fidelity', rh:'Robinhood', schwab:'Schwab' };
const COLORS  = { ibkr:'#f97316', fidelity:'#22c55e', rh:'#ef4444', schwab:'#3b82f6' };

let state = {
  page: 'setup',
  acct: 'all',
  dateFilter: '',
  symFilter: '',
  trades: [],
  positions: [],
  balances: { ibkr:0, fidelity:0, rh:0, schwab:0 },
  scriptUrl: localStorage.getItem('scriptUrl') || '',
  connected: false,
  syncing: false,
  lastSync: null
};

// ── Formatting helpers ────────────────────────────────────────
const fmt     = n => n==null ? '—' : '$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtSign = n => { if(n==null) return '—'; return (n>=0?'+$':'-$')+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); };
const cls     = n => n==null?'':(n>=0?'pos':'neg');
const chip    = b => `<span class="chip chip-${b}">${BROKERS[b]}</span>`;
const badge   = a => `<span class="badge badge-${a==='BUY'?'buy':a==='SELL'?'sell':'spread'}">${a}</span>`;
const fmtDate = d => new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});

// ── Google Sheets API ─────────────────────────────────────────
async function api(params, body) {
  if (!state.scriptUrl) throw new Error('No script URL configured');
  const url = state.scriptUrl + '?' + new URLSearchParams(params);
  const res = await fetch(url, body ? {
    method: 'POST',
    body: JSON.stringify(body),
    headers: { 'Content-Type': 'text/plain' }   // Apps Script requires text/plain for POST
  } : { method: 'GET' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function syncNow() {
  if (!state.scriptUrl) { showPage('setup'); return; }
  setSyncStatus('loading', '↺ syncing…');
  try {
    const data = await api({ action: 'getAll' });
    if (!data.ok) throw new Error(data.msg);
    if (Array.isArray(data.trades))    state.trades    = data.trades;
    if (Array.isArray(data.positions)) state.positions = data.positions;
    if (data.balances && typeof data.balances === 'object') state.balances = data.balances;
    state.connected = true;
    state.lastSync  = new Date();
    setSyncStatus('ok', '✓ synced ' + state.lastSync.toLocaleTimeString());
    render();
  } catch(e) {
    setSyncStatus('err', '✗ ' + e.message);
  }
}

async function pushTrades() {
  try {
    await api({}, { action: 'saveTrades', data: state.trades });
    await api({}, { action: 'saveBalances', data: state.balances });
    state.lastSync = new Date();
    setSyncStatus('ok', '✓ saved ' + state.lastSync.toLocaleTimeString());
  } catch(e) {
    setSyncStatus('err', '✗ save failed: ' + e.message);
  }
}

async function pushAll() {
  try {
    await api({}, { action: 'saveTrades',    data: state.trades });
    await api({}, { action: 'savePositions', data: state.positions });
    await api({}, { action: 'saveBalances',  data: state.balances });
    state.lastSync = new Date();
    setSyncStatus('ok', '✓ saved ' + state.lastSync.toLocaleTimeString());
  } catch(e) {
    setSyncStatus('err', '✗ save failed: ' + e.message);
  }
}

async function testConnection() {
  const url = document.getElementById('url-input').value.trim();
  if (!url) { alert('Paste your Web App URL first'); return; }
  setSyncStatus('loading', '↺ testing…');
  try {
    state.scriptUrl = url;
    localStorage.setItem('scriptUrl', url);
    const data = await api({ action: 'ping' });
    if (!data.ok) throw new Error(data.msg);
    state.connected = true;
    setSyncStatus('ok', '✓ connected!');
    await syncNow();
    showPage('activity');
  } catch(e) {
    setSyncStatus('err', '✗ ' + e.message);
    state.connected = false;
  }
}

function setSyncStatus(type, msg) {
  const el = document.getElementById('sync-status');
  const dot = document.getElementById('conn-dot');
  el.className = 'sync-status ' + type;
  el.textContent = msg;
  dot.className = 'dot ' + (type === 'ok' ? '' : type === 'loading' ? 'orange' : 'red');
}

// ── CSV parsers ───────────────────────────────────────────────

// Robust CSV line splitter — handles quoted fields containing commas
function splitCSVLine(line) {
  const result = [];
  let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') { inQ = !inQ; }
    else if (c === ',' && !inQ) { result.push(cur.trim()); cur = ''; }
    else { cur += c; }
  }
  result.push(cur.trim());
  return result;
}

function parseCSVLines(text) {
  return text.trim().split('\n').map(splitCSVLine);
}

// Normalise a date string to YYYY-MM-DD
function normaliseDate(raw) {
  if (!raw) return '';
  raw = raw.trim();
  // Already ISO: 2026-05-30 or 20260530
  if (/^\d{8}$/.test(raw)) return raw.slice(0,4)+'-'+raw.slice(4,6)+'-'+raw.slice(6,8);
  if (/^\d{4}-\d{2}-\d{2}/.test(raw)) return raw.slice(0,10);
  // MM/DD/YYYY or MM/DD/YY
  const m = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
  if (m) {
    let y = m[3]; if (y.length===2) y = '20'+y;
    return y+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');
  }
  // IBKR datetime: "2026-05-30, 09:45:00" or "2026-05-30;09:45:00"
  const d2 = raw.match(/^(\d{4}-\d{2}-\d{2})/);
  if (d2) return d2[1];
  return raw.slice(0,10);
}

// Detect if a symbol is an option (contains space + expiry pattern or standard OCC format)
function detectType(symbol) {
  if (!symbol) return 'stock';
  // OCC option format: AAPL  260620C00150000  (21 chars) or shorter variants
  // Also catch "AAPL 150C 06/20" style descriptions
  if (/\d{6}[CP]\d{8}/.test(symbol)) return 'option';   // OCC standard
  if (/\s+\d/.test(symbol)) return 'option';             // space + digits
  if (/[CP]\s*\d{2}\/\d{2}/.test(symbol)) return 'option';
  return 'stock';
}

// ── IBKR Transaction History parser ─────────────────────────
// Handles the "Transaction History" export from IBKR Client Portal
// Section name: "Transaction History" (NOT "Trades" — that is a different export)
// Header row cols (index 0-based):
//   0=Section  1=RowType  2=Date  3=Account  4=Description  5=TransactionType
//   6=Symbol   7=Quantity 8=Price 9=PriceCurrency 10=GrossAmount 11=Commission 12=NetAmount
//
// Also handles the classic "Trades" Activity Statement format as a fallback.
function parseIBKR(text) {
  const lines = parseCSVLines(text);
  const trades = [];

  // ── Detect which format this file uses ───────────────────
  const hasTxnHistory = lines.some(r => r[0] === 'Transaction History' && r[1] === 'Header');
  const hasTradesSection = lines.some(r => r[0] === 'Trades' && r[1] === 'Header');

  if (hasTxnHistory) {
    parseTxnHistory(lines, trades);
  } else if (hasTradesSection) {
    parseActivityStatement(lines, trades);
  } else {
    throw new Error(
      'Unrecognised IBKR file format. Expected either:\n' +
      '• Transaction History export (Client Portal → Accounts → Transaction History → Download)\n' +
      '• Activity Statement export (Client Portal → Reports → Statements → Activity → CSV)'
    );
  }

  // Post-process: calculate spread P&L and group legs
  calcSpreadPnL(trades);

  if (trades.length === 0) {
    throw new Error('No trade rows found in file. Make sure the date range includes actual trades.');
  }
  return trades;
}

// ── Parser for "Transaction History" format (your actual file) ──
// Columns after section+rowtype:
//   Date | Account | Description | Transaction Type | Symbol | Quantity | Price |
//   Price Currency | Gross Amount | Commission | Net Amount
function parseTxnHistory(lines, trades) {
  // Find header row and build column map
  let colMap = null;
  for (let i = 0; i < lines.length; i++) {
    const row = lines[i];
    if (row[0] === 'Transaction History' && row[1] === 'Header') {
      colMap = {};
      for (let c = 2; c < row.length; c++) {
        colMap[row[c].trim()] = c;
      }
      break;
    }
  }
  if (!colMap) throw new Error('Could not find Transaction History header row.');

  const g = (row, name) => {
    const idx = colMap[name];
    return idx != null && idx < row.length ? (row[idx] || '').trim() : '';
  };
  const num = s => parseFloat((s || '').replace(/,/g, '')) || 0;

  for (let i = 0; i < lines.length; i++) {
    const row = lines[i];
    if (row[0] !== 'Transaction History' || row[1] !== 'Data') continue;

    const txType = g(row, 'Transaction Type');

    // Only process actual trades — skip Deposit, Withdrawal, Adjustment etc.
    if (txType !== 'Buy' && txType !== 'Sell') continue;

    const symbol = g(row, 'Symbol');
    if (!symbol || symbol === '-') continue;

    const dateRaw     = g(row, 'Date');
    const description = g(row, 'Description');
    const qtyRaw      = g(row, 'Quantity');
    const priceRaw    = g(row, 'Price');
    const commRaw     = g(row, 'Commission');
    const grossRaw    = g(row, 'Gross Amount');

    const qty   = Math.abs(num(qtyRaw));
    const price = Math.abs(num(priceRaw));
    // Commission: IBKR stores as negative number (cost to you), take abs value
    const comm  = Math.abs(num(commRaw));
    const gross = num(grossRaw); // negative = you paid (buy), positive = you received (sell)

    // Detect type from OCC symbol format: AAPL  260620C00150000
    // or from Transaction Type description containing "P" or "C"
    const type = detectType(symbol);

    trades.push({
      id: 'ibkr-' + i + '-' + Date.now(),
      date: normaliseDate(dateRaw),
      broker: 'ibkr',
      symbol: symbol.trim(),
      description: description,
      type,
      action: txType.toUpperCase(), // 'BUY' or 'SELL'
      qty,
      price,
      commission: comm,
      gross,       // keep gross for P&L calculation
      pnl: null,   // calculated in calcSpreadPnL()
      spreadId: null
    });
  }
}

// ── Parser for classic Activity Statement format ──────────────
// Section = "Trades", columns include T. Price, Comm/Fee, Realized P/L etc.
function parseActivityStatement(lines, trades) {
  let colMap = null;
  for (let i = 0; i < lines.length; i++) {
    const row = lines[i];
    if (row[0] === 'Trades' && row[1] === 'Header') {
      colMap = {};
      for (let c = 2; c < row.length; c++) colMap[row[c].trim()] = c;
      break;
    }
  }
  if (!colMap) return;

  const g = (row, name) => colMap[name] != null ? (row[colMap[name]] || '').trim() : '';
  const num = s => parseFloat((s || '').replace(/,/g, '')) || 0;

  for (let i = 0; i < lines.length; i++) {
    const row = lines[i];
    if (row[0] !== 'Trades' || row[1] !== 'Data') continue;
    const disc = g(row, 'DataDiscriminator');
    if (disc === 'SubTotal' || disc === 'Total') continue;

    const symbol = g(row, 'Symbol');
    if (!symbol) continue;

    const qty    = num(g(row, 'Quantity'));
    const price  = Math.abs(num(g(row, 'T. Price')));
    const comm   = Math.abs(num(g(row, 'Comm/Fee')));
    const realPL = g(row, 'Realized P/L');
    const pnl    = realPL !== '' ? num(realPL) : null;
    const type   = (() => {
      const ac = g(row, 'Asset Category').toLowerCase();
      if (ac.includes('option')) return 'option';
      if (ac.includes('future')) return 'future';
      return detectType(symbol);
    })();

    trades.push({
      id: 'ibkr-' + i + '-' + Date.now(),
      date: normaliseDate(g(row, 'Date/Time')),
      broker: 'ibkr',
      symbol,
      type,
      action: qty < 0 ? 'SELL' : 'BUY',
      qty: Math.abs(qty),
      price,
      commission: comm,
      gross: null,
      pnl: (pnl !== null && !isNaN(pnl)) ? pnl : null,
      spreadId: null
    });
  }
}

// ── Calculate spread P&L from matched legs ────────────────────
// IBKR Transaction History has no Realized P/L column.
// We calculate it by matching opening BUY and closing SELL legs
// of the same symbol. For options spreads, we also group the legs.
function calcSpreadPnL(trades) {
  // Step 1: Group option legs on same date with same underlying → spreadId
  const optTrades = trades.filter(t => t.type === 'option');
  const byDateUnderlying = {};
  optTrades.forEach(t => {
    // Extract underlying: first non-space, non-digit chars of OCC symbol
    // e.g. "CEG   260821P00200000" → "CEG"
    const underlying = t.symbol.replace(/\s+.*$/, '').replace(/\d.*$/, '').trim() || t.symbol;
    const key = t.date + '|' + underlying;
    if (!byDateUnderlying[key]) byDateUnderlying[key] = [];
    byDateUnderlying[key].push(t);
  });
  Object.entries(byDateUnderlying).forEach(([key, legs]) => {
    if (legs.length >= 2) {
      const spreadId = 'spread-' + key.replace('|', '-');
      legs.forEach(t => { t.spreadId = spreadId; });
    }
  });

  // Step 2: Calculate P&L for completed spread pairs on same date
  // Net P&L of a spread = sum of all Gross Amounts of its legs - total commissions
  // (Gross = what you received or paid before commission)
  const spreadGroups = {};
  trades.forEach(t => {
    if (!t.spreadId) return;
    if (!spreadGroups[t.spreadId]) spreadGroups[t.spreadId] = [];
    spreadGroups[t.spreadId].push(t);
  });

  Object.entries(spreadGroups).forEach(([sid, legs]) => {
    // Only calculate if we have both a buy and a sell leg
    const hasBuy  = legs.some(l => l.action === 'BUY');
    const hasSell = legs.some(l => l.action === 'SELL');
    if (!hasBuy || !hasSell) return;

    // Net = sum of gross amounts minus total commissions.
    // IBKR's Gross Amount is already in dollars (price × qty × 100 for options).
    // Do NOT multiply by 100 again.
    const totalGross = legs.reduce((s, l) => s + (l.gross || 0), 0);
    const totalComm  = legs.reduce((s, l) => s + l.commission, 0);
    const netPnL     = totalGross - totalComm;

    // Assign P&L to the last leg (the closing leg by date/time)
    // Mark opening legs as null so only one row shows the P&L
    const sortedLegs = [...legs].sort((a, b) => a.date.localeCompare(b.date));
    const lastLeg = sortedLegs[sortedLegs.length - 1];
    legs.forEach(l => {
      l.pnl = (l === lastLeg) ? Math.round(netPnL * 100) / 100 : null;
    });
  });
}

// ── Fidelity Activity CSV parser ──────────────────────────────
// Real Fidelity header (confirmed):
// Run Date,Action,Symbol,Description,Type,Quantity,Price ($),Commission ($),
// Fees ($),Accrued Interest ($),Amount ($),Cash Balance ($),Settlement Date
//
// Index:  0=RunDate 1=Action 2=Symbol 3=Description 4=Type
//         5=Quantity 6=Price 7=Commission 8=Fees 9=AccruedInterest
//         10=Amount 11=CashBalance 12=SettlementDate
function parseFidelity(text) {
  const lines = parseCSVLines(text);
  const trades = [];

  // Find header row — Fidelity sometimes prepends account info rows before the header
  let headerIdx = -1;
  for (let i = 0; i < Math.min(lines.length, 10); i++) {
    if (lines[i][0] && lines[i][0].toLowerCase().includes('run date')) {
      headerIdx = i; break;
    }
  }
  if (headerIdx === -1) headerIdx = 0; // fallback: assume first row is header

  // Build dynamic column map from header
  const headerRow = lines[headerIdx];
  const colMap = {};
  headerRow.forEach((h, idx) => {
    // Normalise: strip ($), lowercase, trim
    const key = h.replace(/\(\$\)/g,'').replace(/[^a-z0-9 ]/gi,' ').trim().toLowerCase();
    colMap[key] = idx;
  });

  const get = (row, name) => {
    const idx = colMap[name];
    return idx != null && idx < row.length ? row[idx].trim() : '';
  };

  for (let i = headerIdx + 1; i < lines.length; i++) {
    const row = lines[i];
    if (!row || row.length < 5) continue;

    const dateRaw = get(row, 'run date');
    const action  = get(row, 'action');
    const symbol  = get(row, 'symbol');
    const desc    = get(row, 'description');
    const qtyRaw  = get(row, 'quantity');
    const priceRaw= get(row, 'price');
    const commRaw = get(row, 'commission');
    const feesRaw = get(row, 'fees');

    if (!symbol && !desc) continue;  // skip blank rows
    if (!action) continue;           // skip non-trade rows (dividends, etc. unless action present)

    const actionLow = action.toLowerCase();
    // Only process buy/sell transactions (skip DIVIDEND, INTEREST, REINVEST, etc.)
    const isBuy  = actionLow.includes('buy') || actionLow.includes('bought') || actionLow.includes('purchase');
    const isSell = actionLow.includes('sell') || actionLow.includes('sold');
    if (!isBuy && !isSell) continue;

    const qty    = Math.abs(parseFloat(qtyRaw.replace(/,/g,''))  || 0);
    const price  = Math.abs(parseFloat(priceRaw.replace(/[$,]/g,'')) || 0);
    const comm   = Math.abs(parseFloat(commRaw.replace(/[$,]/g,'')) || 0);
    const fees   = Math.abs(parseFloat(feesRaw.replace(/[$,]/g,'')) || 0);
    const totalComm = comm + fees;

    // Symbol: Fidelity sometimes puts option description in Description when Symbol is blank
    const sym = symbol || desc.split(' ')[0];
    const type = detectType(sym) || (desc.toLowerCase().includes('call')||desc.toLowerCase().includes('put') ? 'option' : 'stock');

    trades.push({
      id: 'fid-' + i + '-' + Date.now(),
      date: normaliseDate(dateRaw),
      broker: 'fidelity',
      symbol: sym,
      type,
      action: isBuy ? 'BUY' : 'SELL',
      qty,
      price,
      commission: totalComm,
      pnl: null,   // Fidelity CSV doesn't include realized P/L per trade
      spreadId: null
    });
  }

  if (trades.length === 0) {
    throw new Error('No buy/sell trades found. Make sure you exported from Accounts → Activity & Orders and the date range contains trades.');
  }
  return trades;
}

// ── Robinhood parser ──────────────────────────────────────────
// Header: Activity Date, Instrument, Description, Trans Code, Quantity, Price, Amount
function parseRH(text) {
  const lines = parseCSVLines(text);
  const trades = [];
  // Find header
  let hi = lines.findIndex(r => r[0] && r[0].toLowerCase().includes('activity date'));
  if (hi === -1) hi = 0;
  const hdr = lines[hi];
  const col = {};
  hdr.forEach((h,i) => { col[h.toLowerCase().trim()] = i; });
  const g = (row, k) => { const i = col[k]; return i!=null ? (row[i]||'').trim() : ''; };

  for (let i = hi+1; i < lines.length; i++) {
    const row = lines[i];
    if (row.length < 4) continue;
    const code = g(row,'trans code');
    const desc = g(row,'description').toLowerCase();
    const isBuy  = code==='Buy'  || desc.includes('bought') || desc.includes('buy');
    const isSell = code==='Sell' || desc.includes('sold')   || desc.includes('sell');
    if (!isBuy && !isSell) continue;
    const sym  = g(row,'instrument');
    if (!sym) continue;
    trades.push({
      id:'rh-'+i+'-'+Date.now(), date:normaliseDate(g(row,'activity date')),
      broker:'rh', symbol:sym, type:detectType(sym),
      action:isBuy?'BUY':'SELL',
      qty:Math.abs(parseFloat(g(row,'quantity').replace(/,/g,''))||0),
      price:Math.abs(parseFloat(g(row,'price').replace(/[$,]/g,''))||0),
      commission:0, pnl:null, spreadId:null
    });
  }
  if (!trades.length) throw new Error('No trades found in Robinhood CSV.');
  return trades;
}

// ── Schwab parser ─────────────────────────────────────────────
// Header: Date, Action, Symbol, Description, Quantity, Price, Fees & Comm, Amount
function parseSchwab(text) {
  const lines = parseCSVLines(text);
  const trades = [];
  let hi = lines.findIndex(r => r[0] && r[0].toLowerCase().includes('date'));
  if (hi === -1) hi = 0;
  const hdr = lines[hi];
  const col = {};
  hdr.forEach((h,i) => { col[h.toLowerCase().replace(/[^a-z0-9 ]/g,' ').trim()] = i; });
  const g = (row, k) => { const i = col[k]; return i!=null ? (row[i]||'').trim() : ''; };

  for (let i = hi+1; i < lines.length; i++) {
    const row = lines[i];
    if (row.length < 4) continue;
    const action = g(row,'action');
    const aLow = action.toLowerCase();
    const isBuy  = aLow.includes('buy');
    const isSell = aLow.includes('sell');
    if (!isBuy && !isSell) continue;
    const sym = g(row,'symbol');
    if (!sym) continue;
    const comm = Math.abs(parseFloat((g(row,'fees   comm')||g(row,'fees comm')||'0').replace(/[$,]/g,''))||0);
    trades.push({
      id:'sch-'+i+'-'+Date.now(), date:normaliseDate(g(row,'date')),
      broker:'schwab', symbol:sym, type:detectType(sym),
      action:isBuy?'BUY':'SELL',
      qty:Math.abs(parseFloat(g(row,'quantity').replace(/,/g,''))||0),
      price:Math.abs(parseFloat(g(row,'price').replace(/[$,]/g,''))||0),
      commission:comm, pnl:null, spreadId:null
    });
  }
  if (!trades.length) throw new Error('No trades found in Schwab CSV.');
  return trades;
}

const PARSERS = { ibkr:parseIBKR, fidelity:parseFidelity, rh:parseRH, schwab:parseSchwab };

function handleFile(e, broker) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = async ev => {
    try {
      const newTrades = PARSERS[broker](ev.target.result);
      state.trades = state.trades.filter(t => t.broker !== broker).concat(newTrades);
      setSyncStatus('loading', '↺ saving to Sheets…');
      await pushTrades();
      alert('✓ Imported ' + newTrades.length + ' trades from ' + BROKERS[broker] + '.');
      showPage('activity');
    } catch(err) {
      alert('Import failed for ' + BROKERS[broker] + ':\n\n' + err.message + '\n\nCheck the export instructions in the Import tab.');
      setSyncStatus('err', '✗ import failed');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ── Filtered data ─────────────────────────────────────────────
function filteredTrades() {
  return state.trades.filter(t => {
    if (state.acct !== 'all' && t.broker !== state.acct) return false;
    if (state.dateFilter && t.date !== state.dateFilter) return false;
    if (state.symFilter && !t.symbol.toLowerCase().includes(state.symFilter.toLowerCase())) return false;
    return true;
  });
}
function filteredPositions() {
  return state.positions.filter(p => state.acct === 'all' || p.broker === state.acct);
}

// ── Activity page ─────────────────────────────────────────────
function renderActivity() {
  const trades = filteredTrades();

  const comm    = trades.reduce((s,t)=>s+Number(t.commission),0);
  const wins    = closed.filter(t=>Number(t.pnl)>0).length;

  const cash    = state.acct==='all' ? Object.values(state.balances).reduce((a,b)=>a+Number(b),0) : Number(state.balances[state.acct])||0;

  const byDate = {};
  trades.forEach(t=>{ if(!byDate[t.date]) byDate[t.date]=[]; byDate[t.date].push(t); });

  ${connectionBanner()}
  ${acctTabsHTML()}
  <div class="metrics">
    <div class="metric"><div class="metric-label">Cash Balance</div><div class="metric-val blue">${fmt(cash)}</div></div>

    <div class="metric"><div class="metric-label">Commissions</div><div class="metric-val red">-${fmt(comm)}</div></div>
    <div class="metric"><div class="metric-label">Win Rate</div><div class="metric-val ${winRate>=50?'green':'red'}">${winRate}%</div></div>
    <div class="metric"><div class="metric-label">Closed Trades</div><div class="metric-val">${closed.length}</div></div>
  </div>
  <div class="filter-bar">
    <input type="date" value="${state.dateFilter}" onchange="state.dateFilter=this.value;render()"/>
    <input type="text" placeholder="Symbol..." value="${state.symFilter}" oninput="state.symFilter=this.value;render()" style="flex:1;max-width:180px"/>
    <button class="btn" onclick="state.dateFilter='';state.symFilter='';render()">✕ Clear</button>
  </div>
  ${dates.length===0?`<div class="empty"><div class="empty-icon">📭</div>No trades yet. Go to <strong>Import CSV</strong> to load your first file.</div>`:''}
  ${dates.map(d=>{
    const dt=byDate[d];
    const dPnl=dt.filter(t=>t.pnl!=null).reduce((s,t)=>s+Number(t.pnl),0);
    const dComm=dt.reduce((s,t)=>s+Number(t.commission),0);
    return `
    <div class="day-header">
      <span class="day-label">${fmtDate(d)}</span>
      <span>P&amp;L: <span class="${cls(dPnl)}">${fmtSign(dPnl)}</span> &nbsp;·&nbsp; Comm: <span class="neg">-${fmt(dComm)}</span></span>
    </div>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Account</th><th>Symbol</th><th>Type</th><th>Action</th><th style="text-align:right">Qty</th><th style="text-align:right">Price</th><th style="text-align:right">Commission</th><th style="text-align:right">P&amp;L</th></tr></thead>
        <tbody>
        ${dt.map(t=>`<tr>
          <td>${chip(t.broker)}</td>
          <td style="font-weight:600">${t.symbol}${t.spreadId?'<span class="spread-pill">SPREAD</span>':''}</td>
          <td class="muted">${t.type}</td>
          <td>${badge(t.action)}</td>
          <td style="text-align:right">${t.qty}</td>
          <td style="text-align:right">${t.price<0?'-':''}${fmt(Math.abs(t.price))}</td>
          <td style="text-align:right" class="muted">${t.commission?'-'+fmt(t.commission):'—'}</td>
          <td style="text-align:right;font-weight:600" class="${cls(t.pnl)}">${fmtSign(t.pnl)}</td>
        </tr>`).join('')}

      </table>
    </div>`;
  }).join('')}`;

// ── Spreads page ─────────────────────────────────────────────

function parseOCC(sym) {
  if (!sym) return null;
  var m = sym.trim().match(/^([A-Z]+)\s+(\d{2})(\d{2})(\d{2})([CP])(\d{8})$/);
  if (!m) return null;
  return {
    underlying: m[1].trim(),
    expiry:     '20'+m[2]+'-'+m[3]+'-'+m[4],
    strike:     parseInt(m[6],10)/1000,
    optType:    m[5]
  };
}

function safeDate(iso) {
  if (!iso) return '—';
  var s = String(iso).slice(0,10);
  var d = new Date(s + 'T12:00:00');
  if (isNaN(d.getTime())) return s;
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}
function safeDateShort(iso) {
  if (!iso) return '—';
  var s = String(iso).slice(0,10);
  var d = new Date(s + 'T12:00:00');
  if (isNaN(d.getTime())) return s;
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function calcDays(d1, d2) {
  if (!d1 || !d2) return 1;
  var ms = new Date(String(d2).slice(0,10)+'T12:00:00') - new Date(String(d1).slice(0,10)+'T12:00:00');
  return Math.max(1, Math.round(ms/86400000));
}
function colorVal(n) {
  if (n == null) return 'color:var(--muted)';
  return n >= 0 ? 'color:var(--green)' : 'color:var(--red)';
}
function signStr(n, decimals) {
  if (n == null) return '—';
  decimals = decimals || 2;
  var abs = Math.abs(n).toFixed(decimals);
  return (n >= 0 ? '+$' : '-$') + parseFloat(abs).toLocaleString('en-US',{minimumFractionDigits:decimals,maximumFractionDigits:decimals});
}
function pctStr(n) {
  if (n == null) return '—';
  return (n >= 0 ? '+' : '') + n.toFixed(1) + '%';
}
function aprStr(n) {
  if (n == null) return '—';
  return (n >= 0 ? '+' : '') + n.toFixed(0) + '%';
}

function buildSpreads(trades) {
  // 1. Filter to options only, parse OCC
  var opts = [];
  for (var i=0; i<trades.length; i++) {
    var t = trades[i];
    if (t.type !== 'option') continue;
    var occ = parseOCC(t.symbol);
    if (!occ) continue;
    opts.push({
      date:       String(t.date||'').slice(0,10),
      action:     t.action,
      symbol:     String(t.symbol).trim(),
      qty:        Math.abs(Number(t.qty)||0),
      price:      Math.abs(Number(t.price)||0),
      gross:      Number(t.gross||0),
      commission: Math.abs(Number(t.commission)||0),
      broker:     t.broker,
      occ:        occ
    });
  }

  // 2. Group by exact symbol
  var bySymbol = {};
  for (var i=0; i<opts.length; i++) {
    var t = opts[i];
    if (!bySymbol[t.symbol]) bySymbol[t.symbol] = [];
    bySymbol[t.symbol].push(t);
  }

  // 3. Build a leg for each symbol
  // Rule: sort by date. First date = open. Later date opposite action = close.
  var legs = [];
  var symbols = Object.keys(bySymbol);
  for (var si=0; si<symbols.length; si++) {
    var sym = symbols[si];
    var ts  = bySymbol[sym].slice().sort(function(a,b){ return a.date.localeCompare(b.date); });
    var openDate    = ts[0].date;
    var openAction  = ts[0].action;
    var closeAction = openAction === 'SELL' ? 'BUY' : 'SELL';

    var openTrades  = ts.filter(function(t){ return t.date === openDate; });
    var closeTrades = ts.filter(function(t){ return t.date !== openDate && t.action === closeAction; });

    var closeDate = closeTrades.length ? closeTrades[0].date : null;
    var openQty   = openTrades.reduce(function(s,t){ return s+t.qty; },0);
    var openGross = openTrades.reduce(function(s,t){ return s+t.gross; },0);
    var openComm  = openTrades.reduce(function(s,t){ return s+t.commission; },0);
    var closeGross= closeTrades.reduce(function(s,t){ return s+t.gross; },0);
    var closeComm = closeTrades.reduce(function(s,t){ return s+t.commission; },0);

    // Weighted avg price for open and close
    var openPriceTotal = openTrades.reduce(function(s,t){ return s+t.price*t.qty; },0);
    var closePriceTotal= closeTrades.reduce(function(s,t){ return s+t.price*t.qty; },0);
    var openCloseQty   = closeTrades.reduce(function(s,t){ return s+t.qty; },0);

    legs.push({
      symbol:      sym,
      occ:         ts[0].occ,
      isShort:     openAction === 'SELL',
      openDate:    openDate,
      closeDate:   closeDate,
      openQty:     openQty,
      openGross:   openGross,
      openComm:    openComm,
      openPrice:   openQty  ? openPriceTotal/openQty   : 0,
      closeGross:  closeGross,
      closeComm:   closeComm,
      closePrice:  openCloseQty ? closePriceTotal/openCloseQty : 0,
      broker:      ts[0].broker,
      allTrades:   ts
    });
  }

  // 4. Pair legs into spreads
  // Match: same underlying, same expiry, same openDate, different strike, opposite isShort
  var spreads = [];
  var used = {};
  for (var i=0; i<legs.length; i++) {
    if (used[i]) continue;
    var leg = legs[i];
    for (var j=i+1; j<legs.length; j++) {
      if (used[j]) continue;
      var other = legs[j];
      if (leg.occ.underlying !== other.occ.underlying) continue;
      if (leg.occ.expiry     !== other.occ.expiry)     continue;
      if (leg.occ.strike     === other.occ.strike)      continue;
      if (leg.openDate       !== other.openDate)         continue;
      if (leg.isShort        === other.isShort)          continue;
      used[i] = true; used[j] = true;

      var sl = leg.isShort ? leg   : other;  // short = sold first
      var ll = leg.isShort ? other : leg;    // long  = bought first

      var openCredit = sl.openGross  + ll.openGross;
      var closeDebit = sl.closeGross + ll.closeGross;
      var totalGross = openCredit + closeDebit;
      var totalComm  = sl.openComm + ll.openComm + sl.closeComm + ll.closeComm;

      var closeDate = sl.closeDate || ll.closeDate || null;
      var today     = new Date().toISOString().slice(0,10);
      var expiry    = sl.occ.expiry;
      var isExpired = (expiry < today) && !closeDate;
      var isClosed  = !!closeDate || isExpired;
      var status    = closeDate ? 'closed' : (isExpired ? 'expired' : 'open');
      var endDate   = closeDate || (isExpired ? expiry : today);
      var daysHeld  = calcDays(sl.openDate, endDate);

      var netPnL   = isClosed ? (totalGross - totalComm) : null;
      var strikeW  = Math.abs(sl.occ.strike - ll.occ.strike);
      var qty      = sl.openQty;
      var maxRisk  = (strikeW * 100 * qty) - openCredit;

      var pctReturn = (isClosed && netPnL != null && openCredit > 0)
        ? (netPnL / openCredit * 100) : null;
      var apr = (isClosed && netPnL != null && maxRisk > 0 && daysHeld > 0)
        ? (netPnL / maxRisk) * (365 / daysHeld) * 100 : null;

      var allTrades = sl.allTrades.concat(ll.allTrades)
        .sort(function(a,b){ return a.date.localeCompare(b.date); });

      spreads.push({
        id:          sl.occ.underlying+'-'+expiry+'-'+sl.openDate,
        broker:      sl.broker,
        underlying:  sl.occ.underlying,
        expiry:      expiry,
        optType:     sl.occ.optType,
        status:      status,
        openDate:    sl.openDate,
        closeDate:   closeDate,
        daysHeld:    daysHeld,
        sl:          sl,
        ll:          ll,
        allTrades:   allTrades,
        strikeW:     strikeW,
        qty:         qty,
        openCredit:  openCredit,
        closeDebit:  closeDebit,
        totalGross:  totalGross,
        totalComm:   totalComm,
        maxRisk:     maxRisk,
        netPnL:      netPnL,
        pctReturn:   pctReturn,
        apr:         apr
      });
      break;
    }
  }

  spreads.sort(function(a,b){ return b.openDate.localeCompare(a.openDate); });
  return spreads;
}

function renderSpreads() {
  var allTrades = state.acct === 'all' ? state.trades : state.trades.filter(function(t){ return t.broker === state.acct; });
  var spreads   = buildSpreads(allTrades);

  var statusF = window._spreadStatus || 'all';
  var symF    = (window._spreadSym || '').toLowerCase();
  var filtered = spreads.filter(function(s){
    if (statusF !== 'all' && s.status !== statusF) return false;
    if (symF && s.underlying.toLowerCase().indexOf(symF) === -1) return false;
    return true;
  });

  var withPnL  = filtered.filter(function(s){ return s.netPnL != null; });
  var totalPnl = withPnL.reduce(function(a,s){ return a+s.netPnL; },0);
  var totalCom = filtered.reduce(function(a,s){ return a+s.totalComm; },0);
  var winners  = withPnL.filter(function(s){ return s.netPnL>0; }).length;
  var winRate  = withPnL.length ? Math.round(winners/withPnL.length*100) : 0;
  var pcts     = withPnL.filter(function(s){ return s.pctReturn!=null; }).map(function(s){ return s.pctReturn; });
  var aprs     = withPnL.filter(function(s){ return s.apr!=null; }).map(function(s){ return s.apr; });
  var avgPct   = pcts.length ? pcts.reduce(function(a,v){ return a+v; },0)/pcts.length : 0;
  var avgApr   = aprs.length ? aprs.reduce(function(a,v){ return a+v; },0)/aprs.length : 0;

  function statusBadge(s) {
    if (s.status==='closed')  return '<span class="status-closed">CLOSED</span>';
    if (s.status==='expired') return '<span class="status-expired">EXPIRED</span>';
    return '<span class="status-open">OPEN</span>';
  }

  function makeCard(s) {
    var sl = s.sl; var ll = s.ll;

    // ── Leg table rows ────────────────────────────────────────
    var legHTML = '';
    for (var i=0; i<s.allTrades.length; i++) {
      var t    = s.allTrades[i];
      var occ  = parseOCC(t.symbol);
      var strk = occ ? '$'+occ.strike.toFixed(0) : '—';
      var legNet = Number(t.gross||0) - Number(t.commission||0);
      var isOpening = t.date === s.openDate;
      var role;
      if (isOpening) {
        role = t.action === 'SELL' ? 'Open short' : 'Open long';
      } else {
        role = t.action === 'BUY'  ? 'Close short' : 'Close long';
      }
      legHTML +=
        '<tr>' +

        '<td>' + strk + '</td>' +
        '<td>' + t.qty + '</td>' +
        '<td>' + fmt(t.price) + '</td>' +
        '<td style="color:var(--muted)">-' + fmt(t.commission) + '</td>' +
        '<td style="font-weight:700;' + colorVal(legNet) + '">' + signStr(legNet) + '</td>' +
        '<td style="color:var(--muted)">' + safeDateShort(t.date) + '</td>' +
        '</tr>';
    }

    // ── P&L summary row ───────────────────────────────────────
    var pnlHTML =

      '<div style="flex:1;padding:16px 20px;border-right:1px solid var(--border)">' +

      '</div>' +

      '<div style="font-size:24px;font-weight:800;' + colorVal(s.pctReturn) + '">' +
        (s.pctReturn != null ? pctStr(s.pctReturn) : '<span style="color:var(--muted)">Open</span>') +
      '</div>' +
      (s.pctReturn != null ? '<div style="font-size:11px;color:var(--muted);margin-top:3px">of ' + fmt(s.openCredit) + ' collected</div>' : '') +
      '</div>' +

      '<div style="flex:1;padding:16px 20px;border-right:1px solid var(--border)">' +
      '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px">APR</div>' +
      '<div style="font-size:24px;font-weight:800;' + colorVal(s.apr) + '">' +
        (s.apr != null ? aprStr(s.apr) : '<span style="color:var(--muted)">Open</span>') +
      '</div>' +
      '<div style="font-size:11px;color:var(--muted);margin-top:3px">' + s.daysHeld + ' days held</div>' +
      '</div>' +

      '<div style="flex:1;padding:16px 20px">' +
      '<div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;margin-bottom:6px">Commissions</div>' +
      '<div style="font-size:24px;font-weight:800;color:var(--red)">-' + fmt(s.totalComm) + '</div>' +
      '</div>' +

      '</div>';

    // ── Card ──────────────────────────────────────────────────
    var shortStrike = sl.occ.strike.toFixed(0);
    var longStrike  = ll.occ.strike.toFixed(0);
    var typeLabel   = s.optType === 'P' ? 'PUT SPREAD' : 'CALL SPREAD';
    var typeCls     = s.optType === 'P' ? 'spread-put'  : 'spread-call';

    return '<div class="spread-card">' +

      // Header
      '<div class="spread-header">' +
      '<span class="spread-symbol">' + s.underlying + '</span>' +
      '<span class="spread-type-pill ' + typeCls + '">' + typeLabel + '</span>' +
      '<span class="spread-expiry">Exp: ' + safeDate(s.expiry) + '</span>' +
      statusBadge(s) +
      '<span style="flex:1"></span>' +
      '<span class="chip chip-' + s.broker + '">' + BROKERS[s.broker] + '</span>' +
      '</div>' +

      // Meta grid
      '<div class="spread-meta">' +
      '<div class="spread-meta-item"><span class="spread-meta-label">Short strike</span><span class="spread-meta-val">$' + shortStrike + ' ' + s.optType + '</span></div>' +
      '<div class="spread-meta-item"><span class="spread-meta-label">Long strike</span><span class="spread-meta-val">$' + longStrike  + ' ' + s.optType + '</span></div>' +
      '<div class="spread-meta-item"><span class="spread-meta-label">Width</span><span class="spread-meta-val">$' + s.strikeW.toFixed(0) + '</span></div>' +
      '<div class="spread-meta-item"><span class="spread-meta-label">Contracts</span><span class="spread-meta-val">' + s.qty + '</span></div>' +
      '<div class="spread-meta-item"><span class="spread-meta-label">Opened</span><span class="spread-meta-val">' + safeDate(s.openDate) + '</span></div>' +
      '<div class="spread-meta-item"><span class="spread-meta-label">' + (s.closeDate ? 'Closed' : 'Expiry') + '</span><span class="spread-meta-val">' + safeDate(s.closeDate||s.expiry) + '</span></div>' +
      '<div class="spread-meta-item"><span class="spread-meta-label">Short open px</span><span class="spread-meta-val pos">+' + fmt(sl.openPrice) + '</span></div>' +
      '<div class="spread-meta-item"><span class="spread-meta-label">Long open px</span><span class="spread-meta-val neg">-' + fmt(ll.openPrice) + '</span></div>' +
      (s.closeDate ? '<div class="spread-meta-item"><span class="spread-meta-label">Short close px</span><span class="spread-meta-val neg">-' + fmt(sl.closePrice) + '</span></div>' : '') +
      (s.closeDate ? '<div class="spread-meta-item"><span class="spread-meta-label">Long close px</span><span class="spread-meta-val pos">+' + fmt(ll.closePrice) + '</span></div>' : '') +
      '<div class="spread-meta-item"><span class="spread-meta-label">Credit collected</span><span class="spread-meta-val pos">' + fmt(s.openCredit) + '</span></div>' +
      '<div class="spread-meta-item"><span class="spread-meta-label">Max risk</span><span class="spread-meta-val neg">-' + fmt(s.maxRisk) + '</span></div>' +
      '</div>' +

      // Leg table
      '<div style="overflow-x:auto">' +
      '<table style="width:100%;border-collapse:collapse;font-size:12px">' +
      '<thead><tr style="background:var(--bg2)">' +
      '<th style="padding:8px 12px;text-align:left;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;border-bottom:1px solid var(--border)">Action</th>' +
      '<th style="padding:8px 12px;text-align:left;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;border-bottom:1px solid var(--border)">Role</th>' +
      '<th style="padding:8px 12px;text-align:left;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;border-bottom:1px solid var(--border)">Symbol</th>' +
      '<th style="padding:8px 12px;text-align:right;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;border-bottom:1px solid var(--border)">Strike</th>' +
      '<th style="padding:8px 12px;text-align:right;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;border-bottom:1px solid var(--border)">Qty</th>' +
      '<th style="padding:8px 12px;text-align:right;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;border-bottom:1px solid var(--border)">Price</th>' +
      '<th style="padding:8px 12px;text-align:right;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;border-bottom:1px solid var(--border)">Comm</th>' +
      '<th style="padding:8px 12px;text-align:right;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;border-bottom:1px solid var(--border)">Leg P&L</th>' +
      '<th style="padding:8px 12px;text-align:right;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.8px;border-bottom:1px solid var(--border)">Date</th>' +
      '</tr></thead>' +
      '<tbody>' + legHTML + '</tbody>' +
      '</table></div>' +

      // P&L banner
      pnlHTML +

      '</div>';
  }

  // ── Build full page HTML using string concat only ─────────────
  var filterBtns =
    '<div class="spread-filters">' +
    '<button class="btn ' + (statusF==='all'?'btn-blue':'') + '" onclick="window._spreadStatus=\'all\';render()">All</button>' +
    '<button class="btn ' + (statusF==='open'?'btn-blue':'') + '" onclick="window._spreadStatus=\'open\';render()">Open</button>' +
    '<button class="btn ' + (statusF==='closed'?'btn-blue':'') + '" onclick="window._spreadStatus=\'closed\';render()">Closed</button>' +
    '<button class="btn ' + (statusF==='expired'?'btn-blue':'') + '" onclick="window._spreadStatus=\'expired\';render()">Expired</button>' +
    '<input type="text" placeholder="Symbol..." value="' + (window._spreadSym||'') + '" oninput="window._spreadSym=this.value;render()" style="background:var(--bg2);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:12px;padding:6px 10px;border-radius:var(--radius);height:32px;outline:none;max-width:160px"/>' +
    '</div>';

  var metricsHTML =
    acctTabsHTML() +
    '<div class="metrics">' +
    '<div class="metric"><div class="metric-label">Total Spreads</div><div class="metric-val">' + filtered.length + '</div></div>' +
    '<div class="metric"><div class="metric-label">Realized P&L</div><div class="metric-val ' + (totalPnl>=0?'green':'red') + '">' + signStr(totalPnl) + '</div></div>' +
    '<div class="metric"><div class="metric-label">Win Rate</div><div class="metric-val ' + (winRate>=50?'green':'red') + '">' + winRate + '% (' + winners + '/' + withPnL.length + ')</div></div>' +
    '<div class="metric"><div class="metric-label">Avg Return</div><div class="metric-val ' + (avgPct>=0?'green':'red') + '">' + pctStr(avgPct) + '</div></div>' +
    '<div class="metric"><div class="metric-label">Avg APR</div><div class="metric-val ' + (avgApr>=0?'green':'red') + '">' + aprStr(avgApr) + '</div></div>' +
    '<div class="metric"><div class="metric-label">Total Comm.</div><div class="metric-val red">-' + fmt(totalComm) + '</div></div>' +
    '</div>';

  var cardsHTML = filtered.length === 0
    ? '<div class="empty"><div class="empty-icon">📋</div>No spreads found. Import your IBKR CSV to see spreads here.</div>'
    : filtered.map(makeCard).join('');

  return metricsHTML + filterBtns + cardsHTML;
}

function clearBroker(broker) {
  if (!confirm('Clear all ' + BROKERS[broker] + ' trades? This cannot be undone.')) return;
  state.trades = state.trades.filter(t => t.broker !== broker);
  if (state.scriptUrl) pushTrades();
  render();
}

async function clearAllTrades() {
  if (!confirm('Clear ALL trades from ALL brokers? This cannot be undone.')) return;
  state.trades = [];
  if (state.scriptUrl) {
    setSyncStatus('loading', '↺ clearing…');
    await pushTrades();
  }
  render();
}

    </div>
    <button class="btn btn-green" onclick="pushAll()">↑ Save balances to Sheets</button>
    <button class="btn btn-red" style="margin-left:8px" onclick="clearAllTrades()">✕ Clear all trades</button>
  </div>
  <div class="info-box">
    <h3>How to export CSV from each broker</h3>
    ${Object.entries(BROKERS).map(([k,v])=>`<div class="info-row ${k}"><span class="bname">${v}</span><span class="muted">${exportSteps[k]}</span></div>`).join('')}
  </div>`;
}

// ── Setup page ────────────────────────────────────────────────
function renderSetup() {
  const saved = state.scriptUrl;
  return `
  <div class="setup-wizard">
    ${state.connected ? `<div class="connected-banner">✓ Connected to Google Sheets &nbsp;·&nbsp; ${state.lastSync ? 'Last sync: '+state.lastSync.toLocaleTimeString() : ''}</div>` : ''}

    <div class="step">
      <span class="step-num">1</span><h3>Create a Google Sheet</h3>
      <p>
        Go to <a href="https://sheets.google.com" target="_blank" style="color:var(--blue)">sheets.google.com</a> and create a new blank spreadsheet.<br>
        Name it something like <code>Trading Dashboard</code>.<br>
        Keep the tab open — you'll need it in step 3.
      </p>
    </div>

    <div class="step">
      <span class="step-num">2</span><h3>Open Apps Script</h3>
      <p>
        In your Google Sheet, click the menu: <code>Extensions</code> → <code>Apps Script</code><br>
        A new tab opens with a code editor. Delete any existing code in the editor (it starts with <code>function myFunction() {}</code>).<br>
        Then paste the entire contents of the <code>Code.gs</code> file you downloaded into the editor.<br>
        Click the 💾 <strong>Save</strong> button (or press Ctrl+S / Cmd+S).
      </p>
    </div>

    <div class="step">
      <span class="step-num">3</span><h3>Run the setup function</h3>
      <p>
        In the Apps Script editor, click the function dropdown (it may say <code>myFunction</code> or <code>doGet</code>) and select <code>setupSheets</code>.<br>
        Click the ▶ <strong>Run</strong> button.<br>
        Google will ask for permissions — click <strong>Review Permissions</strong> → choose your Google account → click <strong>Allow</strong>.<br>
        You should see an alert: <em>"✅ All sheets created successfully!"</em>
      </p>
    </div>

    <div class="step">
      <span class="step-num">4</span><h3>Deploy as Web App</h3>
      <p>
        In Apps Script, click <code>Deploy</code> → <code>New deployment</code>.<br>
        Click the gear ⚙ icon next to "Type" and select <strong>Web app</strong>.<br>
        Set <strong>Execute as</strong>: <code>Me</code><br>
        Set <strong>Who has access</strong>: <code>Anyone</code> (no sign-in needed — data is still private)<br>
        Click <strong>Deploy</strong>. Copy the <strong>Web app URL</strong> that appears.
      </p>
    </div>

    <div class="step">
      <span class="step-num">5</span><h3>Paste your Web App URL here</h3>
      <p>Paste the URL you just copied and click Connect:</p>
      <div class="url-box">
        <input type="text" id="url-input" value="${saved}" placeholder="https://script.google.com/macros/s/.../exec" />
        <button class="btn btn-green" onclick="testConnection()">Connect →</button>
      </div>
      <p class="img-hint">The URL looks like: https://script.google.com/macros/s/AKfycb.../exec</p>
    </div>

    <div class="step" style="border-color:#1f6feb">
      <span class="step-num" style="background:var(--muted)">?</span><h3>Free hosting on GitHub Pages</h3>
      <p>
        1. Create a free account at <a href="https://github.com" target="_blank" style="color:var(--blue)">github.com</a><br>
        2. Click <strong>New repository</strong> → name it <code>trading-dashboard</code> → set to <strong>Private</strong><br>
        3. Upload <code>trading-dashboard.html</code> and rename it to <code>index.html</code><br>
        4. Go to <strong>Settings → Pages → Source</strong> → Deploy from branch → <code>main</code><br>
        5. Your dashboard will be live at <code>https://yourusername.github.io/trading-dashboard</code><br><br>
        Your Google Sheets URL is saved in the browser, so it reconnects automatically when you visit.
      </p>
    </div>
  </div>`;
}

// ── Navigation ────────────────────────────────────────────────
function showPage(p) {
  state.page = p;
  document.querySelectorAll('.nav-btn').forEach((b,i) => b.classList.toggle('active', ['activity','spreads','positions','import','setup'][i]===p));
  render();
}
function setAcct(a) { state.acct = a; render(); }

function render() {
  const el = document.getElementById('content');
  if (state.page==='activity')  el.innerHTML = renderActivity();
  else if (state.page==='spreads')   el.innerHTML = renderSpreads();
  else if (state.page==='positions') el.innerHTML = renderPositions();
  else if (state.page==='import')    el.innerHTML = renderImport();
  else el.innerHTML = renderSetup();
}

// ── Boot ──────────────────────────────────────────────────────
if (state.scriptUrl) {
  state.page = 'activity';
  syncNow();
} else {
  state.page = 'setup';
}
render();
</script>
</body>
</html>
